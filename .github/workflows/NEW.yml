name: Windows RDP Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:

    # =========================================================
    # 1. INSTALL NGROK
    # =========================================================
    - name: Install ngrok
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host " INSTALLING NGROK"
        Write-Host "=========================================="

        choco install ngrok -y --no-progress

        $ngrokCommand = Get-Command ngrok -ErrorAction Stop

        Write-Host ""
        Write-Host "ngrok executable:"
        Write-Host $ngrokCommand.Source

        Write-Host ""
        ngrok version


    # =========================================================
    # 2. AUTHENTICATE NGROK
    # =========================================================
    - name: Connect to ngrok account
      shell: powershell
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host " AUTHENTICATING NGROK"
        Write-Host "=========================================="

        if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            Write-Error "NGROK_AUTH_TOKEN GitHub Secret is missing."
            exit 1
        }

        ngrok config add-authtoken "$env:NGROK_AUTH_TOKEN"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "ngrok authentication failed."
            exit 1
        }

        Write-Host ""
        Write-Host "ngrok authentication successful."


    # =========================================================
    # 3. CREATE RDP USER
    # =========================================================
    - name: Create RDP user
      shell: powershell
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host " CREATING RDP USER"
        Write-Host "=========================================="

        if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD GitHub Secret is missing."
            exit 1
        }

        $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

        $existingUser = Get-LocalUser `
            -Name "administrator" `
            -ErrorAction SilentlyContinue

        if ($null -eq $existingUser) {

            Write-Host "Creating administrator account..."

            New-LocalUser `
                -Name "administrator" `
                -Password $securePassword `
                -FullName "RDP Administrator" `
                -Description "Temporary GitHub Actions RDP account"

        }
        else {

            Write-Host "administrator already exists."
            Write-Host "Updating password..."

            Set-LocalUser `
                -Name "administrator" `
                -Password $securePassword
        }

        Enable-LocalUser -Name "administrator"

        # Add to Administrators
        Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "administrator" `
            -ErrorAction SilentlyContinue

        # Add to Remote Desktop Users
        Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "administrator" `
            -ErrorAction SilentlyContinue

        Write-Host ""
        Write-Host "User status:"

        Get-LocalUser `
            -Name "administrator" |
            Select-Object Name, Enabled, Description |
            Format-Table

        Write-Host ""
        Write-Host "RDP username: administrator"


    # =========================================================
    # 4. ENABLE WINDOWS RDP
    # =========================================================
    - name: Enable Windows RDP
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host " ENABLING WINDOWS RDP"
        Write-Host "=========================================="

        # Enable Remote Desktop
        Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

        # -----------------------------------------------------
        # NLA disabled temporarily for compatibility testing
        # -----------------------------------------------------
        Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

        # Enable firewall rules
        Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

        # Configure TermService
        Set-Service `
            -Name "TermService" `
            -StartupType Automatic

        Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

        Start-Sleep -Seconds 5

        Write-Host ""
        Write-Host "Remote Desktop enabled."
        Write-Host "NLA disabled."


    # =========================================================
    # 5. VERIFY LOCAL RDP
    # =========================================================
    - name: Verify local RDP
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host ""
        Write-Host "=========================================="
        Write-Host " LOCAL RDP DIAGNOSTICS"
        Write-Host "=========================================="

        # -----------------------------------------------------
        # TermService
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "=== TermService ==="

        Get-Service TermService |
            Format-Table Name, Status, StartType


        # -----------------------------------------------------
        # RDP registry
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "=== RDP Registry ==="

        Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections"

        Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication"


        # -----------------------------------------------------
        # Firewall
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "=== Remote Desktop Firewall Rules ==="

        Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Where-Object Enabled -eq "True" |
            Select-Object DisplayName, Enabled, Profile, Direction, Action |
            Format-Table


        # -----------------------------------------------------
        # Port 3389
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "=== Port 3389 ==="

        Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue |
            Format-Table `
                LocalAddress,
                LocalPort,
                RemoteAddress,
                RemotePort,
                State,
                OwningProcess


        # -----------------------------------------------------
        # Local connectivity test
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "=== Test localhost:3389 ==="

        $rdpTest = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

        $rdpTest |
            Select-Object `
                ComputerName,
                RemotePort,
                TcpTestSucceeded |
            Format-Table

        if (-not $rdpTest.TcpTestSucceeded) {
            Write-Error "Windows RDP is NOT listening on port 3389."
            exit 1
        }

        Write-Host ""
        Write-Host "LOCAL RDP TEST PASSED."


        - name: Start RDP tunnel
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host " STARTING NGROK RDP TUNNEL"
        Write-Host "=========================================="

        $ngrok = (Get-Command ngrok -ErrorAction Stop).Source

        Write-Host "ngrok: $ngrok"

        # Start ngrok normally, redirecting output to a file.
        $p = Start-Process `
            -FilePath $ngrok `
            -ArgumentList @(
                "tcp",
                "3389",
                "--log=stdout"
            ) `
            -NoNewWindow `
            -RedirectStandardOutput "$PWD\ngrok-output.log" `
            -RedirectStandardError "$PWD\ngrok-error.log" `
            -PassThru

        Write-Host "ngrok PID: $($p.Id)"

        # Wait for tunnel
        $tunnel = $null

        for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            if ($p.HasExited) {
                Write-Host "ngrok exited."
                Get-Content "$PWD\ngrok-output.log" -ErrorAction SilentlyContinue
                Get-Content "$PWD\ngrok-error.log" -ErrorAction SilentlyContinue
                exit 1
            }

            try {

                $api = Invoke-RestMethod `
                    "http://127.0.0.1:4040/api/tunnels" `
                    -ErrorAction Stop

                if ($api.tunnels.Count -gt 0) {
                    $tunnel = $api.tunnels[0]
                    break
                }

            }
            catch {
                Write-Host "Waiting for ngrok API... $i/30"
            }
        }

        if ($null -eq $tunnel) {
            Write-Error "No ngrok tunnel was created."
            exit 1
        }

        $address = $tunnel.public_url -replace "^tcp://", ""

        Write-Host ""
        Write-Host "################################################"
        Write-Host "#              RDP READY                       #"
        Write-Host "################################################"
        Write-Host ""
        Write-Host "RDP ADDRESS:"
        Write-Host $address
        Write-Host ""
        Write-Host "USERNAME:"
        Write-Host "administrator"
        Write-Host ""
        Write-Host "DOMAIN:"
        Write-Host "(blank)"
        Write-Host ""
        Write-Host "################################################"

        # ------------------------------------------------------
        # Keep this SAME step alive.
        # ------------------------------------------------------

        for ($i = 1; $i -le 210; $i++) {

            Start-Sleep -Seconds 10

            if ($p.HasExited) {
                Write-Error "ngrok stopped unexpectedly."
                exit 1
            }

            try {

                $api = Invoke-RestMethod `
                    "http://127.0.0.1:4040/api/tunnels" `
                    -ErrorAction Stop

                $t = $api.tunnels[0]

                Write-Host ""
                Write-Host "========== CHECK $i / 210 =========="
                Write-Host "Time: $(Get-Date)"
                Write-Host "Tunnel: $($t.public_url)"
                Write-Host "ngrok PID: $($p.Id)"
                Write-Host ""

                if ($t.metrics) {
                    Write-Host "Connections:"
                    $t.metrics.conns | ConvertTo-Json
                }

            }
            catch {
                Write-Host "ngrok API unavailable."
            }

            # Check local RDP
            $test = Test-NetConnection `
                127.0.0.1 `
                -Port 3389 `
                -WarningAction SilentlyContinue

            Write-Host ""
            Write-Host "Local RDP 3389: $($test.TcpTestSucceeded)"

            # Show active connections to RDP
            $connections = Get-NetTCPConnection `
                -LocalPort 3389 `
                -ErrorAction SilentlyContinue |
                Where-Object State -ne "Listen"

            if ($connections) {

                Write-Host ""
                Write-Host "ACTIVE RDP CONNECTIONS:"

                $connections |
                    Select-Object `
                        LocalAddress,
                        LocalPort,
                        RemoteAddress,
                        RemotePort,
                        State |
                    Format-Table
            }
        }

        Write-Host "Stopping ngrok..."
        Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
