name: Windows RDP (FIXED)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. Install ngrok
      # ============================================================
      - name: Install ngrok
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " INSTALLING NGROK"
          Write-Host "=========================================="
          choco install ngrok -y --no-progress
          $ngrokCommand = Get-Command ngrok -ErrorAction Stop
          Write-Host ""
          Write-Host "ngrok executable:"
          Write-Host $ngrokCommand.Source
          Write-Host ""
          ngrok version

      # ============================================================
      # 2. Authenticate ngrok
      # ============================================================
      - name: Authenticate ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " AUTHENTICATING NGROK"
          Write-Host "=========================================="
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
              Write-Error "NGROK_AUTH_TOKEN GitHub Secret is missing."
              exit 1
          }
          ngrok config add-authtoken "$env:NGROK_AUTH_TOKEN"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "ngrok authentication failed."
              exit 1
          }
          Write-Host ""
          Write-Host "ngrok authentication successful."

      # ============================================================
      # 3. Create RDP administrator account
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=========================================="
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD GitHub Secret is missing."
              exit 1
          }
          $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force
          $user = Get-LocalUser `
              -Name "administrator" `
              -ErrorAction SilentlyContinue
          if ($null -eq $user) {
              Write-Host "Creating administrator account..."
              New-LocalUser `
                  -Name "administrator" `
                  -Password $securePassword `
                  -FullName "RDP Administrator" `
                  -Description "Temporary GitHub Actions RDP account"
          } else {
              Write-Host "Administrator account already exists."
              Write-Host "Updating password..."
              Set-LocalUser `
                  -Name "administrator" `
                  -Password $securePassword
          }
          Enable-LocalUser -Name "administrator"
          # Administrators group
          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "administrator" `
              -ErrorAction SilentlyContinue
          # Remote Desktop Users group
          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "administrator" `
              -ErrorAction SilentlyContinue
          Write-Host ""
          Write-Host "RDP account setup complete."

      # ============================================================
      # 4. Configure RDP Registry Settings (FIXED)
      # ============================================================
      - name: Configure RDP Registry Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " CONFIGURING RDP REGISTRY"
          Write-Host "=========================================="
          
          # Enable Remote Desktop
          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0
          
          # CRITICAL: Set SecurityLayer to RDP Security (not Negotiate)
          # 0 = RDP Security Layer (most compatible with ngrok)
          # 1 = Negotiate (can have issues with ngrok tunnels)
          # 2 = SSL (incompatible with ngrok)
          Write-Host "Setting SecurityLayer to RDP Security (0)..."
          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "SecurityLayer" `
              -Value 0
          
          # Set Encryption Level to Low for ngrok compatibility
          # 1 = Low, 2 = Medium, 3 = High
          Write-Host "Setting MinEncryptionLevel to Low (1)..."
          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "MinEncryptionLevel" `
              -Value 1
          
          # Disable NLA (Network Level Authentication)
          Write-Host "Disabling NLA (UserAuthentication)..."
          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Value 0
          
          # Set fLogonTimeout to prevent connection hangs
          Write-Host "Setting fLogonTimeout to 60 seconds..."
          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "fLogonTimeout" `
              -Value 60000
          
          Write-Host ""
          Write-Host "Registry configuration complete."

      # ============================================================
      # 5. Stop and Restart Terminal Service
      # ============================================================
      - name: Restart Terminal Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " RESTARTING TERMINAL SERVICE"
          Write-Host "=========================================="
          
          Write-Host "Stopping TermService..."
          Stop-Service -Name "TermService" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          
          Write-Host "Starting TermService..."
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService"
          Start-Sleep -Seconds 5
          
          Write-Host ""
          Write-Host "TermService restarted."

      # ============================================================
      # 6. Enable Windows RDP Firewall Rules
      # ============================================================
      - name: Enable RDP Firewall Rules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " ENABLING RDP FIREWALL RULES"
          Write-Host "=========================================="
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          Write-Host ""
          Write-Host "Firewall rules enabled."

      # ============================================================
      # 7. Verify RDP Configuration
      # ============================================================
      - name: Verify RDP Configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host " RDP CONFIGURATION VERIFICATION"
          Write-Host "=========================================="
          
          Write-Host ""
          Write-Host "=== Registry Settings ==="
          $settings = @{
              "fDenyTSConnections" = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" | Select-Object -ExpandProperty fDenyTSConnections
              "SecurityLayer" = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" | Select-Object -ExpandProperty SecurityLayer
              "MinEncryptionLevel" = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" | Select-Object -ExpandProperty MinEncryptionLevel
              "UserAuthentication" = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" | Select-Object -ExpandProperty UserAuthentication
          }
          
          $settings.GetEnumerator() | ForEach-Object {
              Write-Host "$($_.Key): $($_.Value)"
          }
          
          Write-Host ""
          Write-Host "=== Terminal Service ==="
          Get-Service TermService | Select-Object Name, Status, StartType | Format-Table
          
          Write-Host ""
          Write-Host "=== Port 3389 Listening ==="
          $listening = Get-NetTCPConnection -LocalPort 3389 -State "Listen" -ErrorAction SilentlyContinue
          if ($listening) {
              Write-Host "Port 3389 is listening: YES"
          } else {
              Write-Host "Port 3389 is listening: NO"
              Write-Error "RDP is not listening on port 3389!"
              exit 1
          }
          
          Write-Host ""
          Write-Host "=== Local RDP Test ==="
          $test = Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
          if ($test.TcpTestSucceeded) {
              Write-Host "Local RDP test: PASSED"
          } else {
              Write-Host "Local RDP test: FAILED"
              exit 1
          }

      # ============================================================
      # 8. Start ngrok and keep alive
      # ============================================================
      - name: Start RDP tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " STARTING NGROK RDP TUNNEL"
          Write-Host "=========================================="
          
          $ngrokPath = (Get-Command ngrok -ErrorAction Stop).Source
          
          # Start ngrok
          $ngrokProcess = Start-Process `
              -FilePath $ngrokPath `
              -ArgumentList @("tcp", "3389") `
              -PassThru `
              -WindowStyle Hidden `
              -RedirectStandardOutput "$env:TEMP\ngrok-stdout.log" `
              -RedirectStandardError "$env:TEMP\ngrok-stderr.log"
          
          Write-Host "ngrok PID: $($ngrokProcess.Id)"
          
          # Wait for ngrok API
          Write-Host ""
          Write-Host "Waiting for ngrok tunnel..."
          $tunnel = $null
          for ($attempt = 1; $attempt -le 30; $attempt++) {
              Start-Sleep -Seconds 2
              $processCheck = Get-Process -Id $ngrokProcess.Id -ErrorAction SilentlyContinue
              if ($null -eq $processCheck) {
                  Write-Host "ERROR: ngrok exited unexpectedly."
                  if (Test-Path "$env:TEMP\ngrok-stderr.log") {
                      Write-Host "ngrok stderr:"
                      Get-Content "$env:TEMP\ngrok-stderr.log"
                  }
                  exit 1
              }
              try {
                  $api = Invoke-RestMethod `
                      -Uri "http://127.0.0.1:4040/api/tunnels" `
                      -Method Get `
                      -ErrorAction Stop
                  if ($null -ne $api.tunnels -and $api.tunnels.Count -gt 0) {
                      $tunnel = $api.tunnels[0]
                      break
                  }
              } catch {
                  Write-Host "Attempt $attempt/30: Waiting for ngrok API..."
              }
          }
          
          if ($null -eq $tunnel) {
              Write-Host "ERROR: ngrok tunnel not created."
              exit 1
          }
          
          $publicUrl = $tunnel.public_url
          $rdpAddress = $publicUrl -replace "^tcp://", ""
          
          # Display connection info
          Write-Host ""
          Write-Host "############################################################"
          Write-Host "#                                                          #"
          Write-Host "#                 WINDOWS RDP READY                        #"
          Write-Host "#                                                          #"
          Write-Host "############################################################"
          Write-Host ""
          Write-Host "PUBLIC URL: $publicUrl"
          Write-Host "RDP ADDRESS: $rdpAddress"
          Write-Host ""
          Write-Host "USERNAME: administrator"
          Write-Host "PASSWORD: (from RDP_PASSWORD secret)"
          Write-Host ""
          Write-Host "INSTRUCTIONS:"
          Write-Host "1. Open Remote Desktop Connection"
          Write-Host "2. Computer: $rdpAddress"
          Write-Host "3. Username: administrator"
          Write-Host "4. Password: (your RDP_PASSWORD)"
          Write-Host "5. Click Connect"
          Write-Host ""
          Write-Host "############################################################"
          
          # Monitor connections
          Write-Host ""
          Write-Host "Monitoring for RDP connections (20 minutes timeout)..."
          Write-Host ""
          
          for ($i = 1; $i -le 120; $i++) {
              Start-Sleep -Seconds 10
              
              # Check ngrok
              $ngrokCheck = Get-Process -Id $ngrokProcess.Id -ErrorAction SilentlyContinue
              if ($null -eq $ngrokCheck) {
                  Write-Host "ERROR: ngrok process died!"
                  exit 1
              }
              
              # Check active connections
              $activeRdp = Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Where-Object State -ne "Listen"
              
              if ($activeRdp) {
                  Write-Host "[$(Get-Date)] Active RDP connection detected!"
                  $activeRdp | Select-Object LocalAddress, LocalPort, RemoteAddress, RemotePort, State | Format-Table
              }
              
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Check $i/120 - ngrok running, tunnel active"
          }
          
          Write-Host ""
          Write-Host "Session timeout reached."
          
          # Stop ngrok
          if ($null -ne $ngrokProcess) {
              $stillRunning = Get-Process -Id $ngrokProcess.Id -ErrorAction SilentlyContinue
              if ($stillRunning) {
                  Stop-Process -Id $ngrokProcess.Id -Force -ErrorAction SilentlyContinue
              }
          }
