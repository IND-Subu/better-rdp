name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:

    # =========================================================
    # 1. Install ngrok
    # =========================================================
    - name: Install ngrok
      shell: powershell
      run: |
        Write-Host "Installing ngrok..."

        choco install ngrok -y --no-progress

        $ngrok = Get-Command ngrok -ErrorAction Stop

        Write-Host "ngrok path:"
        Write-Host $ngrok.Source

        ngrok version


    # =========================================================
    # 2. Authenticate ngrok
    # =========================================================
    - name: Connect to ngrok account
      shell: powershell
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            Write-Error "NGROK_AUTH_TOKEN secret is missing."
            exit 1
        }

        ngrok config add-authtoken "$env:NGROK_AUTH_TOKEN"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "ngrok authentication failed."
            exit 1
        }

        Write-Host "ngrok authentication successful."


    # =========================================================
    # 3. Create RDP user
    # =========================================================
    - name: Create RDP user
      shell: powershell
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD secret is missing."
            exit 1
        }

        $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

        $user = Get-LocalUser `
            -Name "administrator" `
            -ErrorAction SilentlyContinue

        if ($null -eq $user) {

            Write-Host "Creating administrator account..."

            New-LocalUser `
                -Name "administrator" `
                -Password $password `
                -FullName "RDP Administrator" `
                -Description "Temporary RDP account"

        } else {

            Write-Host "Administrator already exists."
            Write-Host "Updating password..."

            Set-LocalUser `
                -Name "administrator" `
                -Password $password
        }

        Enable-LocalUser -Name "administrator"

        Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "administrator" `
            -ErrorAction SilentlyContinue

        Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "administrator" `
            -ErrorAction SilentlyContinue

        Write-Host "RDP user configured."

    - name: Enable Windows RDP
      shell: powershell
      run: |

        Write-Host "Enabling Remote Desktop..."

        # Enable RDP
        Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

        # Disable Network Level Authentication temporarily
        # This makes the temporary RDP server compatible with
        # older / alternative Android RDP clients.
        Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

        # Enable Remote Desktop firewall rules
        Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

        # Ensure Remote Desktop service is running
        Set-Service `
            -Name "TermService" `
            -StartupType Automatic

        Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

        Start-Sleep -Seconds 5

        Write-Host ""
        Write-Host "RDP enabled."
        Write-Host "NLA disabled for compatibility testing."

        Write-Host ""
        Write-Host "Testing port 3389..."

        Test-NetConnection `
            127.0.0.1 `
            -Port 3389

    # =========================================================
    # 5. Verify RDP
    # =========================================================
    - name: Verify local RDP
      shell: powershell
      run: |

        Write-Host "=========================================="
        Write-Host " LOCAL RDP DIAGNOSTICS"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "TermService:"

        Get-Service TermService |
            Format-Table Name, Status, StartType

        Write-Host ""
        Write-Host "RDP registry:"

        Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections

        Write-Host ""
        Write-Host "Testing localhost:3389..."

        $test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

        $test |
            Select-Object `
                ComputerName,
                RemotePort,
                TcpTestSucceeded |
            Format-Table

        if (-not $test.TcpTestSucceeded) {

            Write-Error "RDP is not listening on port 3389."
            exit 1
        }

        Write-Host ""
        Write-Host "RDP port 3389 is OPEN."

        Write-Host ""
        Write-Host "Listening connections:"

        Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue |
            Format-Table `
                LocalAddress,
                LocalPort,
                State,
                OwningProcess


    # =========================================================
    # 6. START NGROK + KEEP ALIVE
    #
    # IMPORTANT:
    # ngrok is kept alive in THIS SAME STEP.
    # =========================================================
    - name: Start RDP tunnel and keep alive
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "=========================================="
        Write-Host " STARTING NGROK"
        Write-Host "=========================================="

        $ngrokPath = (Get-Command ngrok -ErrorAction Stop).Source

        Write-Host "ngrok:"
        Write-Host $ngrokPath

        # Start ngrok
        $ngrokProcess = Start-Process `
            -FilePath $ngrokPath `
            -ArgumentList "tcp 3389" `
            -PassThru `
            -WindowStyle Hidden

        Write-Host ""
        Write-Host "ngrok PID:"
        Write-Host $ngrokProcess.Id

        # Wait for ngrok API
        $tunnel = $null

        for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            # Check whether ngrok is still alive
            if ($ngrokProcess.HasExited) {

                Write-Error "ngrok exited unexpectedly."

                exit 1
            }

            try {

                $api = Invoke-RestMethod `
                    -Uri "http://127.0.0.1:4040/api/tunnels" `
                    -Method Get `
                    -ErrorAction Stop

                if ($api.tunnels.Count -gt 0) {

                    $tunnel = $api.tunnels[0]
                    break
                }

            } catch {

                Write-Host "Waiting for ngrok API... $i/30"
            }
        }

        if ($null -eq $tunnel) {

            Write-Error "Could not obtain ngrok tunnel."

            if (-not $ngrokProcess.HasExited) {
                Stop-Process `
                    -Id $ngrokProcess.Id `
                    -Force `
                    -ErrorAction SilentlyContinue
            }

            exit 1
        }


        # =====================================================
        # DISPLAY CONNECTION INFORMATION
        # =====================================================

        $publicUrl = $tunnel.public_url
        $rdpAddress = $publicUrl -replace '^tcp://', ''

        Write-Host ""
        Write-Host ""
        Write-Host "########################################################"
        Write-Host "#                                                      #"
        Write-Host "#             WINDOWS RDP IS READY                     #"
        Write-Host "#                                                      #"
        Write-Host "########################################################"

        Write-Host ""
        Write-Host "NGROK PUBLIC URL:"
        Write-Host $publicUrl

        Write-Host ""
        Write-Host "ANDROID RDP ADDRESS:"
        Write-Host $rdpAddress

        Write-Host ""
        Write-Host "RDP USERNAME:"
        Write-Host "administrator"

        Write-Host ""
        Write-Host "RDP PASSWORD:"
        Write-Host "Use the value stored in GitHub Secret RDP_PASSWORD"

        Write-Host ""
        Write-Host "GATEWAY:"
        Write-Host "No gateway"

        Write-Host ""
        Write-Host "########################################################"
        Write-Host ""


        # =====================================================
        # VERIFY NGROK IS ALIVE
        # =====================================================

        Write-Host "Checking ngrok process..."

        Get-Process `
            -Id $ngrokProcess.Id |
            Format-Table Id, ProcessName, CPU, StartTime


        # =====================================================
        # VERIFY NGROK API
        # =====================================================

        Write-Host ""
        Write-Host "Checking ngrok API..."

        try {

            $check = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -Method Get

            $check.tunnels |
                Select-Object `
                    public_url,
                    proto,
                    name |
                Format-Table

        } catch {

            Write-Error "ngrok API is unavailable."
            exit 1
        }


        # =====================================================
        # KEEP NGROK + RDP ALIVE
        # =====================================================

        Write-Host ""
        Write-Host "=========================================="
        Write-Host " RDP SESSION ACTIVE"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "Keep this GitHub Actions job running."
        Write-Host "Do NOT cancel the workflow."
        Write-Host ""

        # 35 minutes
        Start-Sleep -Seconds 2100


        # =====================================================
        # CLEANUP
        # =====================================================

        Write-Host ""
        Write-Host "RDP session time expired."
        Write-Host "Stopping ngrok..."

        if (-not $ngrokProcess.HasExited) {

            Stop-Process `
                -Id $ngrokProcess.Id `
                -Force `
                -ErrorAction SilentlyContinue
        }

        Write-Host "Done."
